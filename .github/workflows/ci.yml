name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.2', 'stable']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test with race detector
        run: make test-race
      - name: Prek checks and secret scan
        if: matrix.go == 'stable'
        uses: j178/prek-action@v3.0.1
        with:
          extra-args: --all-files --hook-stage manual
      - name: Lint
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
