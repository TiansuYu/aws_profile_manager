# Install commit hooks with `prek install`; run all checks with `make lint`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-tree
        name: Scan working tree for secrets
        entry: gitleaks dir --redact --verbose
        stages: [manual]
        pass_filenames: false
  - repo: local
    hooks:
      - id: go-fmt-check
        name: Go formatting
        entry: make fmt-check
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: Go vet
        entry: make vet
        language: system
        files: \.go$
        pass_filenames: false
